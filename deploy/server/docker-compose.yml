name: memos-server

x-memos-build: &memos-build
  context: ../..
  dockerfile: deploy/server/Dockerfile.memos
  args:
    PIP_INDEX_URL: ${PIP_INDEX_URL:-https://pypi.org/simple}

services:
  memos:
    image: memos-server:local
    build: *memos-build
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      PYTHONPATH: /app/src:/app/scripts
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .server.env}
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - private

  app-backend:
    image: memos-server:local
    build: *memos-build
    restart: unless-stopped
    command:
      - python
      - /app/scripts/memos_frontend_api.py
      - --host
      - 0.0.0.0
      - --port
      - "8011"
      - --base-url
      - http://memos:8000
    env_file:
      - ../../.env
    environment:
      PYTHONPATH: /app/src:/app/scripts
      MEMOS_API_BASE_URL: http://memos:8000
      MEMOS_APP_USER_ID: default
      MEMOS_APP_CUBE_ID: default_cube
      MEMOS_TOPIC_DAILY_LIMIT: "15"
      MEMOS_TOPIC_STATE: /data/topic/topics.json
      MEMOS_WEB_UPLOAD_DIR: /data/uploads
      MEMOS_AUTH_REQUIRED: "true"
      MEMOS_AUTH_COOKIE_SECURE: "true"
      MEMOS_CORS_ALLOWED_ORIGINS: ${MEMOS_CORS_ALLOWED_ORIGINS:-}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .server.env}
    volumes:
      - topic_data:/data/topic
      - upload_data:/data/uploads
    depends_on:
      memos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8011/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - private

  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .server.env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .server.env}
    ports:
      - "${MEMOS_HTTP_PORT:-80}:80"
      - "${MEMOS_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app-backend:
        condition: service_healthy
    networks:
      - private

  neo4j:
    image: neo4j:5.26.6
    restart: unless-stopped
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .server.env}
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - private

  qdrant:
    image: qdrant/qdrant:v1.15.3
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: "6333"
      QDRANT__SERVICE__GRPC_PORT: "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - private

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:
  topic_data:
  upload_data:
  caddy_data:
  caddy_config:

networks:
  private:
    driver: bridge
