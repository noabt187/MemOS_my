name: memos-dev

services:
  memos:
    container_name: memos-api-docker
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../.env
    depends_on:
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      - PYTHONPATH=/app/src:/app/scripts
      - HF_ENDPOINT=https://hf-mirror.com
      - QDRANT_HOST=qdrant-docker
      - QDRANT_PORT=6333
      - NEO4J_URI=bolt://neo4j-docker:7687
    volumes:
      - ../src:/app/src
      - ../scripts:/app/scripts
      - .:/app/docker
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - memos_network

  app-backend:
    container_name: memos-app-backend
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      - python
      - /app/scripts/memos_frontend_api.py
      - --host
      - 0.0.0.0
      - --port
      - "8011"
      - --base-url
      - http://memos:8000
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      PYTHONPATH: /app/src:/app/scripts
      MEMOS_API_BASE_URL: http://memos:8000
      MEMOS_APP_USER_ID: default
      MEMOS_APP_CUBE_ID: default_cube
      MEMOS_TOPIC_DAILY_LIMIT: "15"
      MEMOS_TOPIC_STATE: /data/topic/topics.json
      MEMOS_WEB_UPLOAD_DIR: /data/uploads
      MEMOS_AUTH_COOKIE_SECURE: "false"
    ports:
      - "127.0.0.1:8011:8011"
    volumes:
      - ../scripts:/app/scripts
      - ../.memos/topic:/data/topic
      - ../.memos/uploads:/data/uploads
    depends_on:
      memos:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8011/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - memos_network

  frontend:
    image: memos-frontend:local
    container_name: memos-frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      app-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - memos_network

  neo4j:
    image: neo4j:5.26.6
    container_name: neo4j-docker
    ports:
      - "127.0.0.1:7474:7474"   # HTTP
      - "127.0.0.1:7687:7687"   # Bolt
    healthcheck:
      test: wget http://localhost:7474 || exit 1
      interval: 1s
      timeout: 10s
      retries: 20
      start_period: 3s
    environment:
      NEO4J_ACCEPT_LICENSE_AGREEMENT: "yes"
      NEO4J_AUTH: "neo4j/12345678"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - memos_network

  qdrant:
    image: qdrant/qdrant:v1.15.3
    container_name: qdrant-docker
    ports:
      - "127.0.0.1:6333:6333"  # REST API
      - "127.0.0.1:6334:6334"  # gRPC API
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__SERVICE__HTTP_PORT: 6333
    restart: unless-stopped
    networks:
      - memos_network

volumes:
  neo4j_data:
  neo4j_logs:
  qdrant_data:

networks:
  memos_network:
    driver: bridge
